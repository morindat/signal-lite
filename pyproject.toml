[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "signal-lite"
version = "0.1.0"
description = "Educational Signal-style end-to-end encrypted messaging demo"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "cryptography>=42",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
signal-lite = "signallite.cli:main"

[tool.setuptools.packages.find]
include = ["signallite*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
